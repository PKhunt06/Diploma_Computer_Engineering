// P-5-B b. find the highest from given three values

<html>
<head><title>P-5-B</title></head>
<body>
<script>
var num1,num2,num3;
var num1=prompt("Enter 1st no:-");
var num2=prompt("Enter 2nd no:-");
var num3=prompt("Enter 3rd no:-");
var largest;
if(num1>=num2 && num1>=num3)
largest=num1;
else if(num2>=num1 && num2>=num3)
largest=num2;
else
largest=num3;
document.write(largest);
</script>
</body>
</html>
