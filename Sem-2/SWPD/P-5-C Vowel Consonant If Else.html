// P-5-C Use JavaScript to check whether given character is vowel or consonant using if else ladder.

<html>
<head><title>P-5-C</title></head>
<body>
<script>
var ch=prompt("Enter the character");
if(ch=='a' || ch=='e' || ch=='i' || ch=='o' || ch=='u')
document.write(ch,"is vowel");
else if(ch=='A' || ch=='E' || ch=='I' || ch=='O' || ch=='U')
document.write(ch,"is vowel");
else
document.write(ch,"is consonant");
</script>
</body>
</html>
