// P-6-A Use JavaScript user defined functions to perform the following operations: a. to calculate sum of 1 to n

<html>
<head><title>P-6-A</title></head>
<script>
var i,n,sum=0;
n=prompt("Enter a no:");
function add()
{
for(i=1;i<=n;i++)
{
sum=sum+i;
}
document.write(sum);
}
</script>
<body>
<button onclick="add()">Print</button>
</body>
</html>
