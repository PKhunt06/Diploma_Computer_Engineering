<!-- P-11 Use different bootstrap input groups components to create responsive webpage for job application or any other kind of application. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Marriage Bureau Application Form</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
        rel="stylesheet">

    <style>
        .form-container {
            max-width: 800px;
            margin: 20px auto;
        }

        .input-group-text {
            min-width: 120px;
        }
    </style>
</head>

<body>

    <div class="container form-container">

        <h1 class="mb-4 text-center">Louis Vithal Marriage Bureau</h1>
        <h2 class="mb-4 text-center">Application Form</h2>

        <form>

            <!-- Personal Details -->
            <h4 class="mb-3">Personal Details</h4>

            <!-- Full Name -->
            <div class="mb-3">
                <label for="name" class="form-label">Full Name</label>

                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-person"></i>
                    </span>

                    <input type="text"
                        class="form-control"
                        id="name"
                        placeholder="Name Sirname"
                        required>
                </div>
            </div>

            <!-- Date of Birth -->
            <div class="mb-3">
                <label for="dob" class="form-label">Date of Birth</label>

                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-calendar"></i>
                    </span>

                    <input type="date"
                        class="form-control"
                        id="dob"
                        required>
                </div>
            </div>

            <!-- Gender -->
            <div class="mb-3">
                <label for="gender" class="form-label">Gender</label>

                <div class="input-group">
                    <select id="gender"
                        class="form-select"
                        required>

                        <option value="" disabled selected>
                            Select Gender
                        </option>

                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="female">Darshil</option>
                        <option value="other">Other</option>

                    </select>
                </div>
            </div>

            <!-- Contact Information -->
            <h4 class="mb-3">Contact Information</h4>

            <!-- Email -->
            <div class="mb-3">
                <label for="email" class="form-label">
                    Email Address
                </label>

                <div class="input-group">
                    <span class="input-group-text">@</span>

                    <input type="email"
                        class="form-control"
                        id="email"
                        placeholder="example@example.com"
                        required>
                </div>
            </div>

            <!-- Phone Number -->
            <div class="mb-3">
                <label for="phone" class="form-label">
                    Phone Number
                </label>

                <div class="input-group">
                    <span class="input-group-text">+91</span>

                    <input type="tel"
                        class="form-control"
                        id="phone"
                        placeholder="123-456-7890"
                        required>
                </div>
            </div>

            <!-- Address -->
            <div class="mb-3">
                <label for="address" class="form-label">
                    Address
                </label>

                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-house"></i>
                    </span>

                    <input type="text"
                        class="form-control"
                        id="address"
                        placeholder="123 Main St"
                        required>
                </div>
            </div>

            <!-- Preferences -->
            <h4 class="mb-3">Preferences</h4>

            <!-- Education -->
            <div class="mb-3">
                <label for="education" class="form-label">
                    Education Level
                </label>

                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-graduation-cap"></i>
                    </span>

                    <input type="text"
                        class="form-control"
                        id="education"
                        placeholder="e.g., B.Tech, MBA"
                        required>
                </div>
            </div>

            <!-- Occupation -->
            <div class="mb-3">
                <label for="occupation" class="form-label">
                    Occupation
                </label>

                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-briefcase"></i>
                    </span>

                    <input type="text"
                        class="form-control"
                        id="occupation"
                        placeholder="e.g., Software Engineer"
                        required>
                </div>
            </div>

            <!-- Partner Preferences -->
            <div class="mb-3">
                <label for="partnerPreferences" class="form-label">
                    Partner Preferences
                </label>

                <textarea class="form-control"
                    id="partnerPreferences"
                    rows="4"
                    placeholder="Describe your preferences for a life partner"
                    required></textarea>
            </div>

            <!-- Photo Upload -->
            <div class="mb-3">
                <label for="photo" class="form-label">
                    Upload Photo
                </label>

                <div class="input-group">
                    <input type="file"
                        class="form-control"
                        id="photo"
                        aria-label="Upload Photo"
                        required>

                    <button class="btn btn-outline-secondary"
                        type="button">
                        Upload
                    </button>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary">
                Submit Application
            </button>

        </form>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
