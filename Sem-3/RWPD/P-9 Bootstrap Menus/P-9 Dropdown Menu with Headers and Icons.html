<!-- P-9 Create various types of menus using bootstrap menu components such as right aligned dropdown menu, drop up menu, adding headers of each item etc. and glyphicons components. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dropdown with Headers, Icons, and Custom Text</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
        rel="stylesheet">

    <style>
        /* Custom hover color for dropdown items */
        .dropdown-menu .dropdown-item:hover {
            background-color: #343a40;
            color: #ffffff;
        }

        /* Custom active color for dropdown items */
        .dropdown-menu .dropdown-item:active {
            background-color: #495057;
            color: #ffffff;
        }
    </style>
</head>

<body>

    <div class="container mt-5">

        <div class="dropdown">

            <!-- Dropdown Button -->
            <button class="btn btn-secondary dropdown-toggle"
                type="button"
                id="dropdownMenuButton"
                data-bs-toggle="dropdown"
                aria-expanded="false">

                Dropdown with Headers, Icons, and Text

            </button>

            <!-- Dropdown Menu -->
            <ul class="dropdown-menu" aria-labelledby="dropdownMenuButton">

                <!-- Custom Text -->
                <li>
                    <a class="dropdown-item disabled text-center"
                        href="#"
                        tabindex="-1"
                        aria-disabled="true">

                        MANTHAN OP !!

                    </a>
                </li>

                <li>
                    <hr class="dropdown-divider">
                </li>

                <!-- Section 1 -->
                <li>
                    <h6 class="dropdown-header">OUR PROFILE</h6>
                </li>

                <li>
                    <a class="dropdown-item" href="#">
                        <i class="bi bi-house-door"></i> Home
                    </a>
                </li>

                <li>
                    <a class="dropdown-item" href="#">
                        <i class="bi bi-person"></i> Profile
                    </a>
                </li>

                <li>
                    <a class="dropdown-item" href="#">
                        <i class="bi bi-gear"></i> Settings
                    </a>
                </li>

                <li>
                    <hr class="dropdown-divider">
                </li>

                <!-- Section 2 -->
                <li>
                    <h6 class="dropdown-header">OUR CONTACT</h6>
                </li>

                <li>
                    <a class="dropdown-item" href="#">
                        <i class="bi bi-info-circle"></i> About
                    </a>
                </li>

                <li>
                    <a class="dropdown-item" href="#">
                        <i class="bi bi-question-circle"></i> Help
                    </a>
                </li>

                <li>
                    <a class="dropdown-item" href="#">
                        <i class="bi bi-telephone"></i> Contact
                    </a>
                </li>

            </ul>
        </div>
    </div>

    <!-- Bootstrap JavaScript Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
