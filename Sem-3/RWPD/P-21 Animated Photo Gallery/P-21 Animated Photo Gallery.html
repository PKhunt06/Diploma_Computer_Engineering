<!-- P-21 Design animated photo gallery page using Carousel bootstrap plug-in with minimum seven photos. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Oii Sun - Animated Photo Gallery</title>

    <link
        rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    >

    <style>
        body {
            background-color: #f8f9fa;
        }

        .carousel-item img {
            width: 100%;
            height: auto;
            max-height: 500px;
            object-fit: cover;
        }

        .gallery-title {
            text-align: center;
            margin: 20px 0;
            font-size: 2.5rem;
            color: #333;
        }
    </style>
</head>

<body>

    <div class="container mt-5">

        <h1 class="gallery-title">
            Oii Sun - Animated Photo Gallery
        </h1>

        <!-- Carousel -->
        <div
            id="photoCarousel"
            class="carousel slide"
            data-ride="carousel"
        >

            <!-- Carousel Images -->
            <div class="carousel-inner">

                <div class="carousel-item active">
                    <img
                        src="11.jpg"
                        alt="Photo 1"
                    >
                </div>

                <div class="carousel-item">
                    <img
                        src="22.jpg"
                        alt="Photo 2"
                    >
                </div>

                <div class="carousel-item">
                    <img
                        src="33.jpg"
                        alt="Photo 3"
                    >
                </div>

                <div class="carousel-item">
                    <img
                        src="44.jpg"
                        alt="Photo 4"
                    >
                </div>

                <div class="carousel-item">
                    <img
                        src="55.jpg"
                        alt="Photo 5"
                    >
                </div>

                <div class="carousel-item">
                    <img
                        src="66.jpg"
                        alt="Photo 6"
                    >
                </div>

                <div class="carousel-item">
                    <img
                        src="77.jpg"
                        alt="Photo 7"
                    >
                </div>

            </div>

            <!-- Previous Button -->
            <a
                class="carousel-control-prev"
                href="#photoCarousel"
                role="button"
                data-slide="prev"
            >
                <span
                    class="carousel-control-prev-icon"
                    aria-hidden="true"
                ></span>

                <span class="sr-only">
                    Previous
                </span>
            </a>

            <!-- Next Button -->
            <a
                class="carousel-control-next"
                href="#photoCarousel"
                role="button"
                data-slide="next"
            >
                <span
                    class="carousel-control-next-icon"
                    aria-hidden="true"
                ></span>

                <span class="sr-only">
                    Next
                </span>
            </a>

        </div>

    </div>

    <!-- Bootstrap JS and Dependencies -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>

    <script
        src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js">
    </script>

    <script
        src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js">
    </script>

</body>

</html>
